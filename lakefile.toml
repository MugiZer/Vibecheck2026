name = "rigged"
version = "0.1.0"
defaultTargets = ["Maze", "MazeRuntime", "maze", "Upload", "UploadSpec", "upload-gate", "Decor", "DecorSpec", "decor-gate", "Verification"]

# Maze template: rules, specs, and the certificate checker. No `import Lean`.
[[lean_lib]]
name = "Maze"
srcDir = "templates/maze"

# Untrusted runtime support: search and JSON.
[[lean_lib]]
name = "MazeRuntime"
srcDir = "templates/maze"

# The maze game process.
[[lean_exe]]
name = "maze"
srcDir = "templates/maze"
root = "MazeMain"

# Upload storage decisions, used by the upload gate.
[[lean_lib]]
name = "Upload"
srcDir = "app/upload"
roots = ["Upload.Store"]

# Readable upload-security specs and their proofs.
[[lean_lib]]
name = "UploadSpec"
srcDir = "Specs"
roots = ["UploadSpec.Destination", "UploadSpec.Limit", "UploadSpec.Proofs"]

# Decor gate: may a fetched model go into the scene? No `import Lean`.
[[lean_lib]]
name = "Decor"
srcDir = "app/decor"
roots = ["Decor.Gate"]

# Readable decor-safety specs and their proofs.
[[lean_lib]]
name = "DecorSpec"
srcDir = "Specs"
roots = ["DecorSpec.Safe", "DecorSpec.Proofs"]

# Runs the proved decor gate on a model tree (JSON on stdin) or an asset id.
[[lean_exe]]
name = "decor-gate"
srcDir = "app/decor"
root = "DecorGate"

[[lean_exe]]
name = "upload-gate"
srcDir = "app/upload"
root = "UploadGate"

# The repository's main theorems for `lake comparator` (see Verification/).
[[lean_lib]]
name = "Verification"
roots = ["Verification.Challenge", "Verification.Solution", "Verification.SpecSurface", "Verification.Examples"]

